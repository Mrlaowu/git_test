name: 📰 AI科技热点日报

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  ai-digest:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser pytz

      - name: 🤖 获取 AI 科技热点
        id: fetch_ai_news
        run: |
          python .github/scripts/fetch_ai_news.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 创建日报 Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const digest = fs.readFileSync('.github/scripts/digest_output.md', 'utf8');
            
            const today = new Date();
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📰 AI科技热点日报 - ${today.toLocaleDateString('zh-CN')}`,
              body: digest,
              labels: ['daily-digest', 'ai-tech']
            });
            
            console.log(`✅ Issue #${issue.data.number} 已创建`);

      - name: ✅ 工作流完成
        run: |
          echo "✨ AI科技热点日报推送完成！"
